name: Build TB128FU kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel (with AnyKernel3 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies + modern clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            build-essential zip python3 cpio libelf-dev \
            clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          # unversioned clang, ld.lld, llvm-ar ... live here
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          clang --version | head -1
          export ARCH=arm64
          export SUBARCH=arm64
          ARGS="CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1"
          make O=out $ARGS grass-perf_defconfig
          make O=out $ARGS olddefconfig
          make O=out $ARGS -j$(nproc) 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -n -B2 -A6 -E "error:|Error [0-9]|undefined reference" build.log | head -80 || true
          echo "----- tail -----"
          tail -40 build.log

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} AnyKernel3/ \; || true
          cd AnyKernel3 && zip -r9 ../tb128fu-kernel.zip . -x '.git*'

      - name: Upload zip and raw Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb128fu-kernel
          if-no-files-found: warn
          path: |
            tb128fu-kernel.zip
            out/arch/arm64/boot/Image
            build.log
