name: Build TB128FU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Android Kernel Build Action
        uses: dabao1955/kernel_build_action@v1.10.6
        with:
          kernel-url: ./
          config: P89990JA1_defconfig
          arch: arm64
          android-version: 12
          ksu: true
          ksu-version: v0.9.5
          anykernel3: true
